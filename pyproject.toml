[project]
name = "usertgbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "ngrok>=1.4.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "telethon>=1.44.0",
    # Windows ships no zoneinfo database, so Europe/Kyiv only resolves with
    # this installed. Dates shown to users are Kyiv dates, not UTC ones.
    "tzdata>=2025.1",
    "typer>=0.27.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
management-bot = "management_bot.main:main"
manager-bot = "manager_bot.main:main"
userbot-worker = "userbot.main:main"
db-maintenance = "db_maintenance.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db", "shared", "management_bot", "manager_bot", "userbot", "db_maintenance", "admin_web", "connect_web", "pay_web", "landing"]
