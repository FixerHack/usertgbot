services:
  postgres:
    image: postgres:16-alpine
    container_name: usertgbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usertgbot
      POSTGRES_PASSWORD: usertgbot
      POSTGRES_DB: usertgbot
    volumes:
      - usertgbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usertgbot -d usertgbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    # intentionally no `ports:` — only reachable from other containers on this
    # compose network, not from the public internet.

  migrate:
    build: .
    image: usertgbot:latest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  management-bot:
    build: .
    image: usertgbot:latest
    container_name: usertgbot-management-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "management-bot"]
    # The Mini App connect page runs inside this process (see
    # connect_web/server.py). Bound to the HOST's loopback only: Caddy
    # terminates TLS for moozuku.tech and proxies here, so this port must
    # never be reachable from the outside world directly. Requires
    # CONNECT_WEB_HOST=0.0.0.0 in .env — 127.0.0.1 would bind inside the
    # container's own namespace where Caddy could never reach it.
    ports:
      - "127.0.0.1:${CONNECT_WEB_PORT:-8081}:${CONNECT_WEB_PORT:-8081}"
    volumes:
      - ./logs:/app/logs

  manager-bot:
    build: .
    image: usertgbot:latest
    container_name: usertgbot-manager-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "manager-bot"]
    volumes:
      - ./logs:/app/logs

  userbot-worker:
    build: .
    image: usertgbot:latest
    container_name: usertgbot-userbot-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "userbot-worker"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  usertgbot-pgdata:
