<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оплата</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0f1419;
    --muted: #707579;
    --accent: #3390ec;
    --accent-fg: #ffffff;
    --card: #f4f4f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17212b;
      --fg: #ffffff;
      --muted: #aaaaaa;
      --accent: #6ab3f3;
      --accent-fg: #17212b;
      --card: #232e3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  p { margin: 0 0 12px; }
  .product { color: var(--muted); }
  .amount { font-size: 34px; font-weight: 700; margin: 8px 0 12px; }
  .note { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:active { opacity: .85; }
</style>
</head>
<body>
<main>
__BODY__
</main>
__SCRIPT__
</body>
</html>
